<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visitas de Obra</title>
<meta name="description" content="Registro de visitas de obra: datos de obra, agentes, notas, fotos, dictado por voz y exportación a PDF y Word.">
<meta name="theme-color" content="#123B63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Visitas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF3F9; --bg-2:#E2EBF5; --card:#FFFFFF; --ink:#14324F; --ink-2:#4D6784; --ink-3:#7D93AB;
  --navy:#123B63; --navy-2:#0D2E4F; --blue:#2F6FAB; --sky:#8FBCE6; --sky-2:#C9DEF3; --line:#D3DFEC;
  --green:#3FA55B; --red:#D9534F; --amber:#E0A32B; --on-navy:#FFFFFF;
  --shadow:0 2px 10px rgba(18,59,99,.10), 0 1px 2px rgba(18,59,99,.06);
  --radius:22px; --radius-s:14px;
  --font:"Fira Sans",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A27; --bg-2:#132436; --card:#182A3D; --ink:#E8F0F8; --ink-2:#A9BCD0; --ink-3:#7E93A9;
    --navy:#2F6FAB; --navy-2:#255C90; --blue:#6FA6DC; --sky:#4B7EB0; --sky-2:#243B55; --line:#2A3F57;
    --shadow:0 2px 10px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A27; --bg-2:#132436; --card:#182A3D; --ink:#E8F0F8; --ink-2:#A9BCD0; --ink-3:#7E93A9;
  --navy:#2F6FAB; --navy-2:#255C90; --blue:#6FA6DC; --sky:#4B7EB0; --sky-2:#243B55; --line:#2A3F57;
  --shadow:0 2px 10px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
img{max-width:100%;display:block}
#app{min-height:100dvh;display:flex;flex-direction:column;max-width:680px;margin:0 auto;background:var(--bg);position:relative}
@media (min-width:700px){#app{min-height:100vh;box-shadow:0 0 0 1px var(--line)}}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--bg);border-bottom:1px solid var(--line);min-height:64px}
.topbar .ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--navy);flex:none}
.topbar .ib:active{background:var(--bg-2)}
.topbar .ib svg{width:26px;height:26px}
.topbar .ttl{flex:1;min-width:0}
.topbar .ttl h1{margin:0;font-size:22px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.topbar .ttl .sub{font-size:14px;color:var(--ink-2);margin-top:1px}
.topbar .ttl .sub button{color:var(--ink-2);text-decoration:underline dotted;text-underline-offset:3px}
.brand{display:flex;flex-direction:column;align-items:center;line-height:1;padding:0 6px;color:var(--navy)}
.brand svg{width:46px;height:22px;display:block}
.brand b{font-weight:700;font-size:20px;letter-spacing:.06em;margin-top:-6px}
.brand.lg svg{width:120px;height:56px}
.brand.lg b{font-size:52px;margin-top:-12px}

/* ---------- Layout ---------- */
.page{flex:1;display:flex;flex-direction:column}
.content{flex:1;padding:16px 16px 120px}
.content.tight{padding-bottom:180px}
h2.sec{font-size:22px;font-weight:700;color:var(--navy);margin:8px 0 14px}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 12px}
.sec-row h2{margin:0}
.sec-row .lnk{color:var(--ink-2);font-size:14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px}
.card.tap{width:100%;text-align:left;display:block}
.card.tap:active{transform:scale(.99)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card .t{font-size:21px;font-weight:600;color:var(--navy);margin:0;line-height:1.25}
.card .s{font-size:17px;color:var(--ink-2);margin-top:8px}
.card .s.small{font-size:15px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:15px;color:var(--ink);white-space:nowrap;flex:none}
.pill i{width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block}
.pill.cerrada i{background:var(--ink-3)}
.empty{text-align:center;color:var(--ink-2);padding:40px 20px}
.empty h3{color:var(--navy);font-size:22px;margin:16px 0 8px;font-weight:600;text-wrap:balance}
.empty p{margin:0;font-size:17px}
.empty svg{width:min(70vw,300px);height:auto;margin:0 auto}

/* ---------- Bottom actions ---------- */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;pointer-events:none}
.bottom .in{max-width:680px;margin:0 auto;padding:10px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;pointer-events:auto;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:999px;background:var(--navy);color:var(--on-navy);font-size:20px;font-weight:600;letter-spacing:.02em;box-shadow:0 4px 14px rgba(18,59,99,.25)}
.btn:active{background:var(--navy-2)}
.btn.up{text-transform:uppercase}
.btn.ghost{background:var(--card);color:var(--navy);box-shadow:var(--shadow);font-weight:500}
.btn.danger{background:var(--red)}
.btn[disabled]{opacity:.5}
.tools{display:flex;gap:12px}
.tools .tool{flex:1;height:60px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--navy)}
.tools .tool svg{width:28px;height:28px}
.tools .tool:active{background:var(--sky-2)}
.tools .tool.rec{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,83,79,.5)}50%{box-shadow:0 0 0 12px rgba(217,83,79,0)}}
@media (prefers-reduced-motion:reduce){.tools .tool.rec{animation:none}}

/* ---------- Forms ---------- */
.field{margin-bottom:18px}
.field label,.lbl{display:block;font-size:17px;color:var(--ink);margin:0 0 8px 2px}
.inp{width:100%;min-height:56px;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:0 20px;font-size:18px;color:var(--ink)}
.inp:focus{border-color:var(--blue)}
textarea.inp{border-radius:var(--radius);padding:14px 18px;min-height:90px;resize:vertical;line-height:1.4}
.inp::placeholder{color:var(--ink-3)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{flex:1;min-height:56px;font-size:18px;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px}
.seg button svg{width:22px;height:22px;flex:none}
.seg button.on{background:var(--green);color:#fff}
.seg button.on.off{background:var(--ink-3)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{min-height:54px;border-radius:999px;border:1.5px solid var(--navy);background:var(--card);color:var(--navy);font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;text-align:center;line-height:1.15}
.chip.on{background:var(--navy);color:var(--on-navy)}
.chip svg{width:20px;height:20px;flex:none}
.agent{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-top:14px}
.agent .ah{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.agent .ah b{font-size:17px;color:var(--navy)}
.agent .ah input{font-weight:600;color:var(--navy);border:0;border-bottom:1.5px dashed var(--line);background:none;font-size:17px;padding:4px 0;flex:1;min-width:0}
.agent .grid{display:grid;gap:10px}
.agent .inp{min-height:48px;font-size:16px;border-radius:14px;padding:0 14px}
.agent .x{color:var(--red);width:36px;height:36px;display:grid;place-items:center;border-radius:10px}
.agent .x svg{width:20px;height:20px}
.hint{font-size:14px;color:var(--ink-3);margin:6px 2px 0}

/* ---------- Visit blocks ---------- */
.bloque{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px 14px;margin-bottom:14px}
.bh{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--ink-2);font-size:14px}
.bh .k{display:flex;align-items:center;gap:6px;flex:1;font-weight:500}
.bh .k svg{width:18px;height:18px}
.bh .acts{display:flex;gap:2px}
.bh .acts button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}
.bh .acts button:active{background:var(--bg-2)}
.bh .acts button svg{width:20px;height:20px}
.bh .acts button.del{color:var(--red)}
.bloque textarea{width:100%;border:0;background:transparent;resize:none;font-size:17px;line-height:1.45;padding:4px 2px;min-height:44px;overflow:hidden;color:var(--ink)}
.bloque textarea::placeholder{color:var(--ink-3)}
.bloque .ph{border-radius:var(--radius-s);overflow:hidden;background:var(--bg-2);margin-bottom:8px}
.bloque .ph img{width:100%;max-height:60vh;object-fit:contain;margin:0 auto}
.bloque .cm{border-top:1px dashed var(--line);padding-top:6px}
.bloque .cm textarea{font-size:16px;min-height:38px}
.recbar{position:fixed;left:0;right:0;bottom:0;z-index:30;pointer-events:none}
.recbar .in{max-width:680px;margin:0 auto;pointer-events:auto;background:var(--card);border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.12)}
.recbar .st{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--red);margin-bottom:6px}
.recbar .st i{width:12px;height:12px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite}
.recbar .interim{color:var(--ink-2);min-height:22px;font-size:16px}
.recbar .btn{margin-top:10px;min-height:50px;font-size:18px}

/* ---------- Drawer / sheets ---------- */
.backdrop{position:fixed;inset:0;background:rgba(10,25,40,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.backdrop.left{align-items:stretch;justify-content:flex-start}
.drawer{width:min(78vw,340px);background:var(--bg);height:100%;display:flex;flex-direction:column;box-shadow:8px 0 30px rgba(0,0,0,.25)}
.drawer .hero{background:var(--sky-2);padding:calc(48px + env(safe-area-inset-top)) 20px 44px;display:grid;place-items:center}
.drawer nav{display:flex;flex-direction:column;padding:26px 8px}
.drawer nav button{display:flex;align-items:center;gap:22px;padding:20px 22px;font-size:20px;font-weight:500;color:var(--navy);text-align:left;border-radius:14px}
.drawer nav button:active{background:var(--bg-2)}
.drawer nav svg{width:28px;height:28px;flex:none}
.drawer .ver{margin-top:auto;text-align:center;color:var(--ink-3);padding:20px;font-size:15px}
.sheet{width:100%;max-width:680px;background:var(--bg);border-radius:26px 26px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}
.sheet .grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:4px 4px 14px;font-size:20px;color:var(--navy);font-weight:600}
.sheet .opt{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:16px 18px;margin-bottom:10px;box-shadow:var(--shadow);font-size:18px;color:var(--ink)}
.sheet .opt svg{width:26px;height:26px;color:var(--navy);flex:none}
.sheet .opt small{display:block;font-size:14px;color:var(--ink-2);margin-top:2px}
.sheet .opt.danger,.sheet .opt.danger svg{color:var(--red)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:16px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:15px;z-index:60;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.search{padding:0 16px 8px}
.logo-prev{width:160px;height:80px;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;background:var(--card);overflow:hidden;margin-bottom:8px}
.logo-prev img{max-height:76px;max-width:156px;object-fit:contain}
.row{display:flex;gap:10px;align-items:center}
.row .btn{min-height:48px;font-size:16px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   VISITAS DE OBRA · aplicación de una sola página, sin dependencias.
   Secciones: utilidades · almacenamiento · estado y navegación · pantallas
   · editor de visita · fotos · voz · exportación (PDF, DOCX, ZIP) · entrega
   ===================================================================== */

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function fmtDate(iso, long) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString('es-ES', long ? { day: 'numeric', month: 'long', year: 'numeric' } : { day: '2-digit', month: 'short', year: 'numeric' }).replace('.', '');
}
let toastT; function toast(msg) { let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); } t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600); }
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ---------- iconos ---------- */
const I = {
  menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7-7-7 7 7 7"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/><path d="M10 11v6M14 11v6"/></svg>',
  pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v6"/><path d="M14 3v5h5"/><path d="M19 8v3"/><text x="3" y="21" font-size="8.5" font-weight="700" fill="currentColor" stroke="none" font-family="Arial,sans-serif">PDF</text></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="8" r=".6" fill="currentColor"/></svg>',
  text: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 11h14M5 15h14M5 19h9"/></svg>',
  image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>',
  camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 6-6 6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 10 6 6 6-6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  checkc: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-7" fill="none" stroke="#123B63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  word: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v6"/><path d="M14 3v5h5"/><path d="M19 8v3"/><text x="2" y="21" font-size="8" font-weight="700" fill="currentColor" stroke="none" font-family="Arial,sans-serif">DOCX</text></svg>',
  save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h12l4 4v12H4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>',
  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m-5 5 5-5 5 5"/><path d="M4 20h16"/></svg>',
  building: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5l8-3v19M12 9l8 3v9M4 21h16"/><path d="M8 8h1M8 12h1M8 16h1M16 16h1"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13m-5-8 5-5 5 5"/><path d="M5 12v8h14v-8"/></svg>',
  arc: '<svg viewBox="0 0 120 56" fill="none" stroke="#8FBCE6" stroke-width="7" stroke-linecap="round"><path d="M8 54C14 26 36 8 60 8s46 18 52 46"/></svg>'
};
const brand = (lg) => `<div class="brand${lg ? ' lg' : ''}">${I.arc}<b>VISITA</b></div>`;

/* ---------- almacenamiento (IndexedDB con respaldo en localStorage) ---------- */
const Store = (() => {
  const hasIDB = typeof indexedDB !== 'undefined';
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('visitas-obra', 1);
    r.onupgradeneeded = e => { const d = e.target.result; d.createObjectStore('obras', { keyPath: 'id' }); d.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction(store, mode); const q = fn(t.objectStore(store)); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  const ls = { get: k => { try { return JSON.parse(localStorage.getItem('vo:' + k) || 'null'); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem('vo:' + k, JSON.stringify(v)); } catch { toast('Sin espacio para guardar: reduce fotos'); } } };
  if (!hasIDB) return {
    allObras: async () => ls.get('obras') || [],
    putObra: async o => { const a = (ls.get('obras') || []).filter(x => x.id !== o.id); a.push(o); ls.set('obras', a); },
    delObra: async id => ls.set('obras', (ls.get('obras') || []).filter(x => x.id !== id)),
    getKV: async k => ls.get(k), setKV: async (k, v) => ls.set(k, v)
  };
  return {
    allObras: () => tx('obras', 'readonly', s => s.getAll()),
    putObra: o => tx('obras', 'readwrite', s => s.put(o)),
    delObra: id => tx('obras', 'readwrite', s => s.delete(id)),
    getKV: k => tx('kv', 'readonly', s => s.get(k)),
    setKV: (k, v) => tx('kv', 'readwrite', s => s.put(v, k))
  };
})();

/* ---------- render ---------- */

/* ---------- acciones (delegación de eventos) ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-go],[data-act]'); if (!el) return;
  const goTo = el.dataset.go, act = el.dataset.act;
  if (goTo) {
    closeOverlay();
    if (goTo === 'back') return back();
    if (goTo === 'menu') return openMenu();
    if (goTo === 'obra') return go({ name: 'obra', id: el.dataset.id });
    if (goTo === 'obraForm') { S.draft = null; return go({ name: 'obraForm', id: el.dataset.id || null }); }
    if (goTo === 'visita') return go({ name: 'visita', obraId: el.dataset.obra, id: el.dataset.id });
    if (goTo === 'perfil') return go({ name: 'perfil' });
  }
  const v = S.view;
  switch (act) {
    case 'search': S.searchOpen = !S.searchOpen; if (!S.searchOpen) S.query = ''; render(); if (S.searchOpen) $('#q').focus(); break;
    case 'sort': S.sortDesc = !S.sortDesc; render(); break;
    case 'estado': S.draft.estado = el.dataset.v; render(); break;
    case 'rol': { const r = el.dataset.r; const i = S.draft.agentes.findIndex(a => a.rol === r && !a.custom); if (i >= 0) S.draft.agentes.splice(i, 1); else S.draft.agentes.push({ rol: r, nombre: '', telefono: '', email: '' }); render(); break; }
    case 'rolOtro': S.draft.agentes.push({ rol: '', nombre: '', telefono: '', email: '', custom: true }); render(); setTimeout(() => { const c = document.querySelectorAll('.agent'); const last = c[c.length - 1]; if (last) { last.scrollIntoView({ behavior: 'smooth', block: 'center' }); last.querySelector('input').focus(); } }, 50); break;
    case 'rmAgent': S.draft.agentes.splice(+el.dataset.i, 1); render(); break;
    case 'saveObra': await doSaveObra(); break;
    case 'delObra': confirmSheet('Eliminar esta obra', 'Se borrarán la obra y todas sus visitas y fotos. Esta acción no se puede deshacer.', async () => { await Store.delObra(el.dataset.id); S.obras = S.obras.filter(x => x.id !== el.dataset.id); toast('Obra eliminada'); go({ name: 'home' }, true); }); break;
    case 'nuevaVisita': { const o = findObra(el.dataset.id); const numero = o.visitas.reduce((m, x) => Math.max(m, x.numero), 0) + 1; const vis = { id: uid(), numero, fecha: todayISO(), bloques: [], createdAt: Date.now() }; o.visitas.push(vis); await saveObra(o); go({ name: 'visita', obraId: o.id, id: vis.id }); break; }
    case 'fecha': { const inp = $('#fecha-inp'); if (inp.showPicker) { try { inp.showPicker(); } catch { inp.click(); } } else inp.click(); break; }
    case 'addTexto': addBloque({ tipo: 'texto', texto: '' }); break;

async function doSaveObra() {
  const d = S.draft;
  if (!d.nombre.trim()) { toast('Pon un nombre a la obra'); $('#f-nombre').focus(); return; }
  d.agentes = d.agentes.map(a => ({ ...a, rol: (a.rol || 'Otro agente').trim(), nombre: a.nombre.trim(), telefono: a.telefono.trim(), email: a.email.trim() }));
  const isNew = d.id === 'new';
  if (isNew) { d.id = uid(); d.createdAt = Date.now(); }
  await saveObra(d);
  const i = S.obras.findIndex(x => x.id === d.id); if (i >= 0) S.obras[i] = d; else S.obras.push(d);

/* ---------- bloques de la visita ---------- */
function curVisita() { const o = findObra(S.view.obraId); return { o, vis: findVisita(o, S.view.id) }; }
function addBloque(b, focus = true) {
  const { o, vis } = curVisita(); b.id = uid(); vis.bloques.push(b); saveObraDebounced(o); render();

  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); if (focus) { const ta = el.querySelector('textarea'); if (ta && b.tipo !== 'foto') ta.focus(); } }
  return b;
}
function bloqueAct(act, id) {
  const { o, vis } = curVisita(); const i = vis.bloques.findIndex(b => b.id === id); if (i < 0) return;
  if (act === 'bDel') { confirmSheet('Eliminar bloque', 'Se eliminará este bloque de la visita.', async () => { vis.bloques.splice(i, 1); await saveObra(o); render(); }); return; }
  const j = act === 'bUp' ? i - 1 : i + 1; if (j < 0 || j >= vis.bloques.length) return;
  [vis.bloques[i], vis.bloques[j]] = [vis.bloques[j], vis.bloques[i]]; saveObraDebounced(o); render();
}

/* ---------- fotos: redimensionado a JPEG ---------- */
function loadImage(file) { return new Promise((res, rej) => { const url = URL.createObjectURL(file); const img = new Image(); img.onload = () => { URL.revokeObjectURL(url); res(img); }; img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imagen')); }; img.src = url; }); }
async function resizeImage(file, max, q, whiteBg) {
  const img = await loadImage(file);
  let w = img.naturalWidth, h = img.naturalHeight; const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
  const c = document.createElement('canvas'); c.width = w; c.height = h; const ctx = c.getContext('2d');
  if (whiteBg) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
  ctx.drawImage(img, 0, 0, w, h);

}
async function addFotos(files) {
  toast(files.length > 1 ? `Añadiendo ${files.length} fotos…` : 'Añadiendo foto…');
  let last = null;
  for (const f of files) { try { const im = await resizeImage(f, 1600, 0.82, true); last = addBloque({ tipo: 'foto', src: im.src, w: im.w, h: im.h, comentario: '' }, false); } catch { toast('No se pudo leer una imagen'); } }
  if (last) { const el = document.querySelector(`.bloque[data-id="${last.id}"] textarea`); if (el) el.focus(); }
}

/* ---------- dictado por voz (Web Speech API) ---------- */
let rec = null, recBloque = null, recFinal = '';
function startRec() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { sheet(`<h3>Dictado no disponible</h3><p style="margin:0 4px 12px;color:var(--ink-2)">Este navegador no permite el dictado directo. Añade un bloque de texto y usa el micrófono del teclado del móvil para dictar.</p><button class="btn" data-act="addTexto">Añadir bloque de texto</button>`); return; }
  if (rec) return stopRec();
  const { o, vis } = curVisita();
  recBloque = addBloque({ tipo: 'voz', texto: '' }, false); recFinal = '';
  rec = new SR(); rec.lang = 'es-ES'; rec.continuous = true; rec.interimResults = true;
  const bar = document.createElement('div'); bar.className = 'recbar'; bar.innerHTML = `<div class="in"><div class="st"><i></i> Escuchando… habla con claridad</div><div class="interim" id="interim"></div><button class="btn danger" data-act="stopRec">Parar dictado</button></div>`;
  document.body.appendChild(bar);
  const micBtn = document.querySelector('[data-act="addVoz"]'); if (micBtn) micBtn.classList.add('rec');
  rec.onresult = ev => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) recFinal += (recFinal && !/\s$/.test(recFinal) ? ' ' : '') + r[0].transcript.trim(); else interim += r[0].transcript; }
    const b = vis.bloques.find(x => x.id === recBloque.id); if (b) { b.texto = recFinal; const ta = document.querySelector(`.bloque[data-id="${b.id}"] textarea`); if (ta) { ta.value = recFinal; autoGrow(ta); } saveObraDebounced(o); }
    const it = $('#interim'); if (it) it.textContent = interim;
  };
  rec.onerror = ev => { if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') { toast('Permiso de micrófono denegado. Usa el micrófono del teclado.'); } else if (ev.error !== 'no-speech' && ev.error !== 'aborted') toast('Error de dictado: ' + ev.error); };
  rec.onend = () => { if (rec) { try { rec.start(); } catch { stopRec(); } } }; // reinicio automático mientras el usuario no pare
  try { rec.start(); } catch (err) { toast('No se pudo iniciar el dictado'); stopRec(); }
}
function stopRec() {
  if (!rec) return; const r = rec; rec = null; try { r.onend = null; r.stop(); } catch {}
  const bar = $('.recbar'); if (bar) bar.remove();
  const micBtn = document.querySelector('[data-act="addVoz"]'); if (micBtn) micBtn.classList.remove('rec');
  const b = recBloque; recBloque = null;
  if (b) { const { o, vis } = curVisita(); if (vis) { const bb = vis.bloques.find(x => x.id === b.id); if (bb && !bb.texto.trim()) { vis.bloques = vis.bloques.filter(x => x.id !== b.id); render(); } saveObra(o); } }
}

   EXPORTACIÓN · generador PDF mínimo (sin librerías)
   ===================================================================== */
const measureCtx = document.createElement('canvas').getContext('2d');

function wrapText(text, maxW, size, bold) {
  const out = [];
  for (const para of String(text || '').replace(/\r/g, '').split('\n')) {
    const words = para.split(/\s+/).filter(Boolean); if (!words.length) { out.push(''); continue; }
    let line = '';
    for (let w of words) {
      while (textWidth(w, size, bold) > maxW && w.length > 1) { let cut = w.length; while (cut > 1 && textWidth(w.slice(0, cut), size, bold) > maxW) cut--; if (line) { out.push(line); line = ''; } out.push(w.slice(0, cut)); w = w.slice(cut); }
      const t = line ? line + ' ' + w : w;
      if (!line || textWidth(t, size, bold) <= maxW) line = t; else { out.push(line); line = w; }
    }
    out.push(line);
  }
  return out;
}
const CP1252 = { '€': 128, '‚': 130, 'ƒ': 131, '„': 132, '…': 133, '†': 134, '‡': 135, 'ˆ': 136, '‰': 137, 'Š': 138, '‹': 139, 'Œ': 140, 'Ž': 142, '‘': 145, '’': 146, '“': 147, '”': 148, '•': 149, '–': 150, '—': 151, '˜': 152, '™': 153, 'š': 154, '›': 155, 'œ': 156, 'ž': 158, 'Ÿ': 159 };

const n2 = n => (Math.round(n * 100) / 100).toString();

class MiniPDF {
  constructor() {
    this.W = 595.28; this.H = 841.89; this.objects = []; this.pages = []; this.images = new Map();
    this.catalogId = this.add(null); this.pagesId = this.add(null);

    this.f2 = this.add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');

  add(o) { this.objects.push(o); return this.objects.length; }

      pageIds.push(this.add(`<< /Type /Page /Parent ${this.pagesId} 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 ${this.f1} 0 R /F2 ${this.f2} 0 R /F3 ${this.f3} 0 R >> ${xo ? `/XObject << ${xo} >>` : ''} >> /Contents ${cId} 0 R >>`));
    }
    this.objects[this.pagesId - 1] = `<< /Type /Pages /Kids [${pageIds.map(i => i + ' 0 R').join(' ')}] /Count ${pageIds.length} >>`;
    this.objects[this.catalogId - 1] = `<< /Type /Catalog /Pages ${this.pagesId} 0 R >>`;
    const infoId = this.add(`<< /Producer (Visitas de Obra) /Creator (Visitas de Obra) /CreationDate (D:${new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14)}) >>`);

    chunks.push(latin1(xref));
    return new Blob(chunks, { type: 'application/pdf' });
  }
}

const C = { ink: '0.08 0.2 0.31', grey: '0.36 0.45 0.55', line: '0.83 0.87 0.93', white: '1 1 1' };

    { name: '[Content_Types].xml', data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>`) },
    { name: '_rels/.rels', data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`) },
    { name: 'word/document.xml', data: enc.encode(doc) },
    { name: 'word/styles.xml', data: enc.encode(styles) },
    { name: 'word/footer1.xml', data: enc.encode(footer) },
    { name: 'word/_rels/document.xml.rels', data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rIdFooter" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>${rels.map(r => `<Relationship Id="${r.id}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="${r.target}"/>`).join('')}</Relationships>`) },
    ...media.map(m => ({ name: 'word/media/' + m.name, data: m.bytes }))
  ];
  return makeZip(files);
}

/* ---------- entrega del archivo: claude.ai · compartir · descarga ---------- */
async function deliver(blob, filename) {
  if (downloadsNS) { try { await downloadsNS.save({ filename, data: blob }); toast('Archivo guardado'); return; } catch (err) { if (err && err.code === 'declined') return; console.warn('downloads', err); } }
  const type = blob.type || 'application/octet-stream';
  const file = new File([blob], filename, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: filename }); return; } catch (err) { if (err && err.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 20000); toast('Descargando ' + filename);
}

/* ---------- arranque ---------- */
(async function init() {
  try { S.obras = (await Store.allObras()) || []; const p = await Store.getKV('perfil'); if (p) S.perfil = { ...S.perfil, ...p }; } catch (err) { console.error(err); toast('No se pudieron cargar los datos guardados'); }
  S.obras.forEach(o => { o.visitas = o.visitas || []; o.agentes = o.agentes || []; });
  history.replaceState({ name: 'home' }, ''); render();
  if (window.claude && typeof window.claude.use === 'function') { try { downloadsNS = await window.claude.use('downloads'); } catch { downloadsNS = null; } }
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !window.claude) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
  document.addEventListener('visibilitychange', () => { if (document.hidden && S.view.name === 'visita') { const { o } = curVisita(); if (o) saveObra(o); } });
})();
</script>
